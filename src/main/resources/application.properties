spring.application.name=AutoFinderBot

telegram.bot.token = ${TELEGRAM_BOT_TOKEN}

synchronization.cars.expired-after.days = 30

logging.level.com.example.autofinderbot = DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5435/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/main/db.changelog-master.yaml

spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

app.jwt.expiration-in-ms=1800000

springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/docs

server.error.whitelabel.enabled=false

