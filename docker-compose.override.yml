version: '3.8'

services:
  app:
    container_name: spring-boot-app-dev
    env_file:
      - .env.dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/otomoto
      SPRING_DATASOURCE_USERNAME: admin-dev
      SPRING_DATASOURCE_PASSWORD: admin-dev
    ports:
        - "8082:8080"
    networks:
      - dev-network

  postgres:
    container_name: postgres-otomoto-dev
    environment:
      POSTGRES_USER: admin-dev
      POSTGRES_PASSWORD: admin-dev
      POSTGRES_DB: otomoto
    ports:
      - "5433:5432"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
